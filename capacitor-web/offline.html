<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaccine Talks — Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f0e8;
        color: #40606d;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        line-height: 1.55;
        max-width: 22rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.65rem 1.25rem;
        border-radius: 999px;
        border: none;
        background: #40606d;
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No internet connection</h1>
      <p>
        Vaccine Talks needs a connection for most pages. Saved resource bookmarks on this device may
        still appear in the app when you are back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
